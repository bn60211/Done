name: name: Advanced Video Downloader and Splitter

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'URL of the video to download'
        required: true
        type: string
      save_path:
        description: 'Path within the repository to save files (e.g., videos/)'
        required: true
        type: string
      video_quality:
        description: 'Video quality (e.g., bestvideo[height<=1080], bestvideo[height=720], bestvideo[height<=480])'
        required: false
        default: 'bestvideo[height<=1080]'
        type: string
      audio_quality:
        description: 'Audio quality for MP3 extraction (e.g., bestaudio)'
        required: false
        default: 'bestaudio'
        type: string

jobs:
  download_and_process:
    runs-on: ubuntu-latest
    env:
      VIDEO_URL: ${{ github.event.inputs.video_url }}
      SAVE_PATH: ${{ github.event.inputs.save_path }}
      VIDEO_QUALITY: ${{ github.event.inputs.video_quality }}
      AUDIO_QUALITY: ${{ github.event.inputs.audio_quality }}
      MAX_FILE_SIZE_MB: 80 # حداکثر حجم فایل به مگابایت

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }} # توکن برای push کردن

    - name: Set up Python and dependencies
      uses: actions/setup-python@v5
      with:
        python-version: '3.x'
    - name: Install yt-dlp and ffmpeg
      run: |
        pip install yt-dlp
        sudo apt-get update
        sudo apt-get install -y ffmpeg

    - name: Download video and audio
      id: download
      run: |
        # ساخت مسیر ذخیره سازی اگر وجود ندارد
        mkdir -p ${{ env.SAVE_PATH }}

        # دانلود ویدیو با کیفیت مشخص شده
        # -o: فرمت نام‌گذاری فایل خروجی. اینجا ویدیو را در SAVE_PATH ذخیره می‌کنیم.
        # --write-thumbnail: دانلود thumbnail (اختیاری)
        # --no-part: جلوگیری از ایجاد فایل‌های موقت .part
        # --allow-unplayable: اجازه دانلود فایل‌های غیر قابل پخش (در برخی موارد)
        yt-dlp -o "${{ env.SAVE_PATH }}video.%(ext)s" --write-thumbnail --no-part --allow-unplayable -f "${{ env.VIDEO_QUALITY }}" "${{ env.VIDEO_URL }}"

        # دانلود بهترین صدا و تبدیل به MP3
        yt-dlp -x --audio-format mp3 --audio-quality ${{ env.AUDIO_QUALITY }} -o "${{ env.SAVE_PATH }}audio.%(ext)s" --no-part "${{ env.VIDEO_URL }}"

        echo "::set-output name=downloaded_video_path::${{ env.SAVE_PATH }}video.*"
        echo "::set-output name=downloaded_audio_path::${{ env.SAVE_PATH }}audio.mp3"

    - name: Get downloaded file size
      id: get_size
      run: |
        VIDEO_FILE=$(find "${{ env.SAVE_PATH }}" -name 'video.*' | head -n 1)
        FILE_SIZE_BYTES=$(stat -c%s "$VIDEO_FILE")
        FILE_SIZE_MB=$(echo "$FILE_SIZE_BYTES / 1024 / 1024" | bc)
        echo "Video file size: ${FILE_SIZE_MB} MB"
        echo "::set-output name=size_mb::$FILE_SIZE_MB"
        echo "::set-output name=video_file::$VIDEO_FILE"

    - name: Split video if too large
      if: ${{ steps.get_size.outputs.size_mb > env.MAX_FILE_SIZE_MB }}
      run: |
        VIDEO_FILE="${{ steps.get_size.outputs.video_file }}"
        MAX_SIZE_MB=${{ env.MAX_FILE_SIZE_MB }}
        AUDIO_FILE="${{ env.SAVE_PATH }}audio.mp3"
        SPLIT_DIR="${{ env.SAVE_PATH }}split_video/"
        mkdir -p "$SPLIT_DIR"

        echo "Splitting video file $VIDEO_FILE into parts of max $MAX_SIZE_MB MB..."

        # محاسبه تعداد پارت‌ها و زمان هر پارت (به طور تقریبی)
        # این بخش نیاز به تنظیم دقیق دارد زیرا حجم ویدیو قبل از دانلود مشخص نیست
        # استفاده از ffmpeg برای تقسیم‌بندی بر اساس حجم یا زمان
        # مثال زیر بر اساس زمان تقسیم می‌کند، برای تقسیم بر اساس حجم نیاز به ابزار دیگری یا اسکریپت پیچیده‌تر است.

        # **توجه:** تقسیم‌بندی دقیق بر اساس مگابایت با ffmpeg بسیار پیچیده است.
        # روش معمول‌تر، تقسیم بر اساس زمان است. یا استفاده از ابزاری که بتواند حجم را تخمین بزند.
        # در اینجا یک مثال ساده با فرض تقسیم بر اساس زمان (مثلاً هر 5 دقیقه) آورده شده است.
        # برای تقسیم دقیق حجمی، ممکن است نیاز به نوشتن اسکریپت پایتون جداگانه باشد.

        # مثال تقسیم بر اساس زمان (هر 5 دقیقه)
        ffmpeg -i "$VIDEO_FILE" -c copy -map 0 -segment_time 00:05:00 -f segment -reset_timestamps 1 "$SPLIT_DIR/part_%03d.mp4"

        # اگر موفقیت‌آمیز بود، فایل اصلی را حذف کرده و پارت‌ها را جایگزین می‌کنیم
        rm "$VIDEO_FILE"
        mv "$SPLIT_DIR"* "${{ env.SAVE_PATH }}" # انتقال پارت‌ها به پوشه اصلی

        echo "Video split into parts."

    - name: Commit and push changes
      run: |
        git config --global user.name 'GitHub Actions'
        git config --global user.email 'actions@github.com'
        git add .
        # بررسی کنید که آیا تغییری برای commit وجود دارد یا نه
        if git diff --staged --quiet; then
          echo "No changes to commit."
        else
          git commit -m "Automated video and audio download and processing"
          git push
        fi
